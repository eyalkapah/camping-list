<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><title>A1 — מסך הרשימה</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ---------- וריאנט A: אקורדיון קטגוריות ---------- */
.vA .top{padding:16px 18px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.vA h1{font-size:19px;margin:0 0 2px}
.vA .cat{border-bottom:1px solid var(--line);background:var(--card)}
.vA .cat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 18px;font-weight:600;font-size:14.5px}
.vA .cat>summary::-webkit-details-marker{display:none}
.vA .cat .bar{flex:1;height:5px;border-radius:99px;background:#eceae5;overflow:hidden}
.vA .cat .bar i{display:block;height:100%;background:var(--accent)}
.vA .it{display:flex;align-items:center;gap:10px;padding:9px 18px 9px 18px;border-top:1px solid #f2efe9}
.vA .it .n{flex:1;font-size:14px}
.vA .it.miss .n{color:var(--warn);font-weight:600}

/* ---------- וריאנט B: גלילה רציפה + צ'יפים ---------- */
.vB .tool{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px}
.vB .search{width:100%;border:1px solid var(--line);border-radius:99px;padding:9px 14px;
  font:inherit;font-size:14px;background:#fff}
.vB .chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px}
.vB .chips::-webkit-scrollbar{height:0}
.vB .chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;
  border-radius:99px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.vB .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vB .sh{position:sticky;top:96px;background:var(--bg);padding:9px 16px 5px;
  font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.vB .it{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;
  border-top:1px solid #f2efe9}
.vB .it .n{flex:1;font-size:14.5px}

/* ---------- וריאנט C: קלפי אנשים ---------- */
.vC{background:#efece6}
.vC .hd{padding:16px 18px 6px}
.vC .deck{display:flex;gap:12px;overflow-x:auto;padding:8px 18px 14px;scroll-snap-type:x mandatory}
.vC .deck::-webkit-scrollbar{height:0}
.vC .pcard{flex:0 0 150px;scroll-snap-align:start;background:#fff;border-radius:16px;padding:14px;
  border:1px solid var(--line);cursor:pointer}
.vC .pcard.on{outline:2px solid var(--accent)}
.vC .pcard .cnt{font-size:26px;font-weight:700;line-height:1.1;margin-top:8px}
.vC .list{background:#fff;border-radius:18px 18px 0 0;padding:16px 18px 30px;min-height:330px}
.vC .list .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f2efe9;font-size:14.5px}

/* ---------- וריאנט D: מצב קניות ---------- */
.vD{background:#fff}
.vD .hd{padding:20px 20px 12px;border-bottom:2px solid var(--ink)}
.vD .hd h1{margin:0;font-size:23px}
.vD .row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #eee;
  cursor:pointer;font-size:19px}
.vD .box{width:28px;height:28px;border:2px solid var(--ink);border-radius:7px;flex:0 0 auto;
  display:grid;place-items:center;font-size:17px;color:#fff}
.vD .row.on{color:var(--faint)}
.vD .row.on .box{background:var(--accent);border-color:var(--accent)}
.vD .row.on .nm{text-decoration:line-through}
.vD .nm{flex:1}
.vD .q{font-size:15px;color:var(--muted)}
.vD .foot{padding:18px 20px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="proto-head">
  <h1>A1 · מסך הרשימה</h1>
  <p class="qq">השאלה: האם ארגון לפי קטגוריה באמת עדיף על ארגון לפי אנשים — או שרק שכנענו את עצמנו?</p>
  <p>ארבע פריסות שחולקות בדיוק את אותם נתונים. חיצים או ←/→ להחלפה.</p>
</div>
<div id="app"></div>

<script src="data.js"></script>
<script src="proto.js"></script>
<script>
let bFilter = 'all';
let dChecked = {};

/* ============ A · אקורדיון קטגוריות ============ */
function varA() {
  const cats = CAMP.cats.map(c => {
    const its = CAMP.byCat(c.n);
    if (!its.length) return '';
    const got = its.filter(i => i.by).length;
    const miss = its.length - got;
    return `<details class="cat" ${miss ? 'open' : ''}>
      <summary>
        <span>${c.i}</span><span>${c.n}</span>
        <span class="bar"><i style="width:${got / its.length * 100}%"></i></span>
        ${miss ? `<span class="chip w">${miss} חסר</span>` : `<span class="chip a">מלא</span>`}
      </summary>
      ${its.map(i => `<div class="it ${i.by ? '' : 'miss'}">
        ${i.by ? A(i.by) : '<div class="avatar" style="background:#fff;border:1.5px dashed var(--warn);color:var(--warn)">?</div>'}
        <span class="n">${i.n}${i.q ? ` <span class="chip">${i.q}</span>` : ''}</span>
        ${i.dup ? '<span class="chip w">כפול</span>' : ''}
      </div>`).join('')}
    </details>`;
  }).join('');

  return `<div class="vA">
    <div class="top">
      <h1>${CAMP.trip.name}</h1>
      <div class="tiny muted">${CAMP.trip.dates} · ${CAMP.items.length} פריטים ·
        <b style="color:var(--warn)">${CAMP.missing.length} חסרים</b></div>
    </div>${cats}</div>`;
}

/* ============ B · גלילה רציפה + סינון ============ */
function varB() {
  const f = bFilter;
  const pass = i => f === 'all' || (f === 'miss' && !i.by) || (f === 'mine' && i.by === CAMP.me)
    || (f === 'dup' && i.dup) || (f === i.c);
  const groups = CAMP.cats.map(c => {
    const its = CAMP.byCat(c.n).filter(pass);
    if (!its.length) return '';
    return `<div class="sh">${c.n.toUpperCase()}</div>` + its.map(i => `
      <div class="it">
        ${i.by ? A(i.by) : '<div class="avatar" style="background:var(--warn-soft);color:var(--warn)">+</div>'}
        <span class="n">${i.n}${i.q ? ` <span class="chip">${i.q}</span>` : ''}
          ${i.by ? '' : '<div class="tiny" style="color:var(--warn)">אף אחד לא לקח</div>'}</span>
        ${i.dup ? '<span class="chip w">×' + CAMP.dupGroups.find(g => g.key === i.dup).owners.length + '</span>' : ''}
      </div>`).join('');
  }).join('');

  const chip = (k, l) => `<button class="${f === k ? 'on' : ''}" onclick="bFilter='${k}';repaint()">${l}</button>`;
  return `<div class="vB">
    <div class="tool">
      <input class="search" placeholder="חיפוש בכל הרשימה…">
      <div class="chips">
        ${chip('all', 'הכול')}${chip('miss', 'חסר · ' + CAMP.missing.length)}
        ${chip('mine', 'שלי')}${chip('dup', 'כפילויות · ' + CAMP.dupGroups.length)}
        ${CAMP.cats.slice(0, 8).map(c => chip(c.n, c.n)).join('')}
      </div>
    </div>${groups}<div style="height:40px"></div></div>`;
}

/* ============ C · קלפי אנשים ============ */
let cWho = CAMP.me;
function varC() {
  const cards = CAMP.campers.map(p => {
    const n = CAMP.byCamper(p.n).length;
    return `<div class="pcard ${p.n === cWho ? 'on' : ''}" onclick="cWho='${p.n}';repaint()">
      ${A(p.n)}<div class="cnt">${n}</div>
      <div class="tiny muted">${p.n} מביא${n === 1 ? ' פריט' : ' פריטים'}</div></div>`;
  }).join('');
  const mine = CAMP.byCamper(cWho);
  const cats = [...new Set(mine.map(i => i.c))];

  return `<div class="vC">
    <div class="hd"><h1 style="margin:0;font-size:19px">מי מביא מה</h1>
      <div class="tiny muted">${CAMP.campers.length} משפחות · ${CAMP.items.length} פריטים</div></div>
    <div class="deck">${cards}
      <div class="pcard" style="border-style:dashed;border-color:var(--warn)" onclick="cWho=null;repaint()">
        <div class="avatar" style="background:var(--warn)">!</div>
        <div class="cnt" style="color:var(--warn)">${CAMP.missing.length}</div>
        <div class="tiny" style="color:var(--warn)">אף אחד לא לקח</div></div>
    </div>
    <div class="list">
      ${cWho ? `<h3 style="margin:0 0 10px">${cWho}</h3>${cats.map(c => `
        <div class="tiny muted" style="margin-top:12px">${c}</div>
        ${mine.filter(i => i.c === c).map(i => `<div class="it">
          <span style="flex:1">${i.n}</span>
          ${i.q ? `<span class="chip">${i.q}</span>` : ''}
          ${i.dup ? '<span class="chip w">          מישהו נוסף מביא</span>' : ''}</div>`).join('')}`).join('')}`
      : `<h3 style="margin:0 0 10px;color:var(--warn)">חסר — אף אחד לא לקח</h3>
         ${CAMP.missing.map(i => `<div class="it"><span style="flex:1">${i.n}</span>
           <button class="btn p" style="padding:4px 10px">אני</button></div>`).join('')}`}
    </div></div>`;
}

/* ============ D · מצב קניות ============ */
function varD() {
  const mine = CAMP.byCamper(CAMP.me);
  const done = mine.filter(i => dChecked[i.id]).length;
  return `<div class="vD">
    <div class="hd">
      <h1>הקניות שלי</h1>
      <div class="muted" style="font-size:15px">${done} מתוך ${mine.length} · ${CAMP.trip.dates}</div>
    </div>
    ${mine.map(i => `<div class="row ${dChecked[i.id] ? 'on' : ''}"
        onclick="dChecked[${i.id}]=!dChecked[${i.id}];repaint()">
      <div class="box">${dChecked[i.id] ? '✓' : ''}</div>
      <span class="nm">${i.n}</span>
      ${i.q ? `<span class="q">${i.q}</span>` : ''}
    </div>`).join('')}
    <div class="foot">אין כאן קטגוריות ואין אנשים אחרים — זה המסך של מי שעומד בסופר.
      שאר הרשימה נמצאת לשונית אחת משם.</div>
  </div>`;
}

window.VARIANTS = [
  { key: 'A', name: 'אקורדיון קטגוריות', render: varA },
  { key: 'B', name: 'גלילה רציפה + סינון', render: varB },
  { key: 'C', name: 'קלפי אנשים', render: varC },
  { key: 'D', name: 'מצב קניות', render: varD }
];
mountPrototype();
</script>
</body>
</html>
